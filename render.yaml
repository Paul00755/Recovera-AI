services:
  # --------------------------------------------------------------------------
  # 1. Recovera AI - Backend API Web Service (Free Tier)
  # --------------------------------------------------------------------------
  - type: web
    name: recovera-ai-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard with your Neon PostgreSQL connection string
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://recovera-ai-frontend.onrender.com,http://localhost:5173,http://localhost:3000
      - key: UPLOAD_DIR
        value: /tmp/storage
      - key: ONEPLUS_GATEWAY_ENABLED
        value: "false"

  # --------------------------------------------------------------------------
  # 2. Recovera AI - React Frontend (Static Site - Global Free CDN)
  # --------------------------------------------------------------------------
  - type: web
    name: recovera-ai-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://recovera-ai-backend.onrender.com
